name: Deploy queue-x-workers

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: queue-x-workers
  CONTAINER_NAME: queue-x-workers

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        with:
          host: ${{ secrets.WORKER_SERVICE_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            docker pull ${{ steps.build-image.outputs.image }}

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 8080:8080 \
              -e WORKER_DATASOURCE_URL=${{ secrets.WORKER_DATASOURCE_URL }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e AWS_REGION=$AWS_REGION \
              -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              -e SQS_ORDER_QUEUE_URL=${{ secrets.SQS_ORDER_QUEUE_URL }} \
              -e SQS_OUT_OF_STOCK_URL=${{ secrets.SQS_OUT_OF_STOCK_URL }} \
              -e SQS_NOTIFICATION_URL=${{ secrets.SQS_NOTIFICATION_URL }} \
              -e SQS_PAYMENT_QUEUE_URL=${{ secrets.SQS_PAYMENT_QUEUE_URL }} \
              -e SQS_PAYMENT_SUCCESS_QUEUE_URL=${{ secrets.SQS_PAYMENT_SUCCESS_QUEUE_URL }} \
              -e SQS_PAYMENT_FAILED_QUEUE_URL=${{ secrets.SQS_PAYMENT_FAILED_QUEUE_URL }} \
              -e SQS_PAYMENT_FAILED_FOR_ORDER_API_QUEUE_URL=${{ secrets.SQS_PAYMENT_FAILED_FOR_ORDER_API_QUEUE_URL }} \
              -e LOKI_PUSH_URL=${{ secrets.LOKI_PUSH_URL }} \
              ${{ steps.build-image.outputs.image }}

            docker image prune -f